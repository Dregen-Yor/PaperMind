name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: npm

      - name: Verify Node security baseline
        run: node scripts/check-runtime.mjs

      - name: Use pinned npm version
        run: npm install --global npm@10.9.4 --ignore-scripts

      # 跳过 postinstall（electron-rebuild），类型检查不需要原生模块
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript type check
        run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: npm

      - name: Verify Node security baseline
        run: node scripts/check-runtime.mjs

      - name: Use pinned npm version
        run: npm install --global npm@10.9.4 --ignore-scripts

      # 测试层完全 mock 了 window.db，无需编译 better-sqlite3
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test
