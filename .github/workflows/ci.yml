name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  install-test-build:
    name: Install · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2025
          - macos-15-intel
          - macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          check-latest: false
          cache: npm

      - name: Use pinned npm version
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@10.9.4 --ignore-scripts

      - name: Verify exact toolchain
        run: |
          node --version
          npm --version
          npm run verify:toolchain

      - name: Install dependencies
        run: npm ci

      - name: Verify installed Electron and native dependencies
        run: npm run verify:install

      - name: Verify dependency contract stayed unchanged
        run: git diff --exit-code -- package.json package-lock.json .npmrc

      - name: Run full tests on Linux
        if: runner.os == 'Linux'
        run: npm test

      - name: Run security tests on Linux
        if: runner.os == 'Linux'
        run: npm run security:test

      - name: TypeScript type check
        run: npm run typecheck

      - name: Build renderer, main and preload sources
        run: npm run build:source
