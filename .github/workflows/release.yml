name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            eb_args: --linux --x64

          - name: darwin-x64
            os: macos-15-intel
            eb_args: --mac --x64

          - name: darwin-arm64
            os: macos-15
            eb_args: --mac --arm64

          - name: win32-x64
            os: windows-2025
            eb_args: --win --x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          check-latest: false
          cache: npm

      - name: Use pinned npm version
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@10.9.4 --ignore-scripts

      - name: Verify exact toolchain
        run: |
          node --version
          npm --version
          npm run verify:toolchain

      - name: Install dependencies
        run: npm ci

      - name: Verify installed Electron and native dependencies
        run: npm run verify:install

      - name: Verify dependency contract stayed unchanged
        run: git diff --exit-code -- package.json package-lock.json .npmrc

      - name: Build renderer, main and preload sources
        run: npm run build:source

      - name: Build unsigned installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm exec electron-builder -- ${{ matrix.eb_args }}

      # 将 electron-builder 产物重命名为统一的 <name>-<version>-<platform>.* 格式
      - name: Rename artifacts
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP=$(node -p "require('./package.json').name")
          TAG="${GITHUB_REF_NAME:-v${VERSION}}"
          OUTDIR="release"

          case "${{ matrix.name }}" in
            linux-*)
              SRC=$(ls "$OUTDIR"/*.AppImage | head -1)
              DEST="${APP}-${TAG}-${{ matrix.name }}.AppImage"
              ;;
            darwin-*)
              SRC=$(ls "$OUTDIR"/*.dmg | head -1)
              DEST="${APP}-${TAG}-${{ matrix.name }}.dmg"
              ;;
            win32-*)
              SRC=$(ls "$OUTDIR"/*.exe | head -1)
              DEST="${APP}-${TAG}-${{ matrix.name }}.exe"
              ;;
          esac

          mv "$SRC" "$OUTDIR/$DEST"
          ASSET="$OUTDIR/$DEST"
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "CHECKSUM=$ASSET.sha256" >> "$GITHUB_ENV"
          echo "DEST=$DEST" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-${{ matrix.name }}
          path: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-*
          merge-multiple: true
          path: artifacts

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: sha256sum * | tee checksums-sha256.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
